services:
  lab-solver:
    build: .
    image: lab-solution-solver:latest
    container_name: lab-solution-solver
    ports:
      - "8000:8000"
    volumes:
      - solver-data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c",
             "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

volumes:
  solver-data:
